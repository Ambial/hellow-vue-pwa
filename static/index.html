<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="First PWA Vue.js App" />
  <meta name="theme-color" content="#4a6fa5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- iOS App Name -->
  <meta name="apple-mobile-web-app-title" content="Hello Vue PWA" />
  
  <!-- Microsoft Tiles -->
  <meta name="msapplication-TileColor" content="#4a6fa5" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />
  
  <title>Hello PWA!</title>
</head>
<body>
  <div id="app"></div>
  
  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('ServiceWorker registration successful');
          })
          .catch((error) => {
            console.error('ServiceWorker registration failed:', error);
          });
      });
    }
    
    // Install prompt handler for PWA
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-installable'));
      console.log('PWA install prompt available - user can trigger install');
    });

    window.addEventListener('appinstalled', () => {
      window.deferredPrompt = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
      console.log('PWA was installed successfully');
    });
    
    // Call this function from a button click or user gesture to show install prompt
    window.showInstallPrompt = async function() {
      const promptEvent = window.deferredPrompt;
      if (!promptEvent) {
        return false;
      }
      promptEvent.prompt();
      const choiceResult = await promptEvent.userChoice;
      console.log('Install prompt result:', choiceResult.outcome);
      window.deferredPrompt = null;
      return choiceResult.outcome === 'accepted';
    };
  </script>
</body>
</html>
